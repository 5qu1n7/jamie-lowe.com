name: Publish Scheduled Blog Posts

on:
  schedule:
    # Run every day at 8 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check for scheduled posts
        id: check_posts
        run: |
          TODAY=$(date +%Y-%m-%d)
          DRAFT_DIR="src/pages/blog/_drafts"
          
          if [ -d "$DRAFT_DIR" ]; then
            # Find posts with filename matching today's date
            POSTS=$(find "$DRAFT_DIR" -name "*$TODAY-*.astro" 2>/dev/null || true)
            if [ -n "$POSTS" ]; then
              echo "found_posts=true" >> $GITHUB_OUTPUT
              echo "posts=$POSTS" >> $GITHUB_OUTPUT
            else
              echo "found_posts=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "found_posts=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Publish posts and update index
        if: steps.check_posts.outputs.found_posts == 'true'
        run: |
          DRAFT_DIR="src/pages/blog/_drafts"
          TODAY=$(date +%Y-%m-%d)
          
          # Move posts from _drafts to published
          for post in $(find "$DRAFT_DIR" -name "*$TODAY-*.astro" 2>/dev/null || true); do
            FILENAME=$(basename "$post")
            # Remove date prefix from filename (e.g., "2026-03-15-" becomes "")
            NEWNAME=$(echo "$FILENAME" | sed "s/[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//")
            mv "$post" "src/pages/blog/$NEWNAME"
            echo "Published: $NEWNAME"
            
            # Extract title from the published post
            TITLE=$(grep -m1 "title:" "src/pages/blog/$NEWNAME" | sed 's/.*title:.*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/' | tr -d '\n')
            DATE=$(echo "$FILENAME" | grep -oE "^[0-9]{4}-[0-9]{2}-[0-9]{2}")
            
            # Extract description from post content (first paragraph)
            DESC=$(sed -n '/<p>/,/<\/p>/p' "src/pages/blog/$NEWNAME" | head -1 | sed 's/<[^>]*>//g' | xargs | head -c 150)
            
            echo "TITLE=$TITLE"
            echo "DATE=$DATE"
            echo "DESC=$DESC"
            
            # Add to blog list in index.astro
            INDEX_FILE="src/pages/blog/index.astro"
            if [ -f "$INDEX_FILE" ]; then
              # Check if title already exists
              if ! grep -q "$TITLE" "$INDEX_FILE"; then
                # Add new post to the array (insert after first {)
                sed -i "s/const posts = \[/const posts = [\n  { slug: '$NEWNAME', title: \"$TITLE\", description: '$DESC', date: '$DATE' },/" "$INDEX_FILE"
                echo "Added $TITLE to blog index"
              fi
            fi
          done
      
      - name: Commit and push
        if: steps.check_posts.outputs.found_posts == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add src/pages/blog/
          git commit -m "Publish scheduled blog posts for $(date +%Y-%m-%d)"
          git push